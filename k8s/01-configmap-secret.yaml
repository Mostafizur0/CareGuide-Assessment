# Configuration and credentials for the system-health service.
#
# The ConfigMap holds every non-sensitive setting the app understands
# (app/src/system_health/config.py). The Secret holds the values that must
# not be readable in a pod spec.
#
# The committed Secret contains PLACEHOLDERS ONLY. Never commit a real
# credential here — see k8s/README.md for the production path
# (kubectl create secret / Sealed Secrets / External Secrets Operator).

apiVersion: v1
kind: ConfigMap
metadata:
  name: system-health-config
  namespace: careguide-system-health
  labels:
    app.kubernetes.io/name: system-health
    app.kubernetes.io/part-of: careguide
data:
  APP_NAME: "system-health"
  APP_VERSION: "1.0.0"
  # The app must bind 0.0.0.0 to be reachable through the Service.
  HOST: "0.0.0.0"
  PORT: "8080"
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  METRICS_PATH: "/metrics"
  # Longer than terminationGracePeriodSeconds minus the drain window.
  GRACEFUL_TIMEOUT: "30"
  REQUEST_TIMEOUT: "30"
---
apiVersion: v1
kind: Secret
metadata:
  name: system-health-secrets
  namespace: careguide-system-health
  labels:
    app.kubernetes.io/name: system-health
    app.kubernetes.io/part-of: careguide
type: Opaque
stringData:
  # PLACEHOLDER — replace before any real deployment.
  SECRET_KEY: "replace-me-with-a-real-secret-key"
  API_TOKEN: "replace-me-with-a-real-api-token"
