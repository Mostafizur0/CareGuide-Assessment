# CareGuide — observability stack.
#
# Runs alongside the application stack in docker-compose.yml and attaches to
# the same `app-bridge` network, which the application stack creates. If the
# application stack is not running yet, create the network first:
#
#   docker network create app-bridge
#
# Only Grafana is published to the host (3000). Prometheus, Loki, Alloy,
# Node Exporter and cAdvisor are reachable exclusively over app-bridge.

name: careguide-monitoring

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: careguide-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30 day retention for the metric history.
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    networks:
      - app-bridge

  loki:
    image: grafana/loki:3.2.1
    container_name: careguide-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
    networks:
      - app-bridge

  alloy:
    image: grafana/alloy:v1.5.1
    container_name: careguide-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Read-only Docker socket: Alloy discovers the containers and tails them.
      # Mounted as a single file so the Docker Desktop symlink is resolved on
      # the host side (see the cadvisor service for the same reasoning).
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - app-bridge

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: careguide-node-exporter
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials/.+|var/lib/docker/.+)($|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    pid: host
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.3
    networks:
      - app-bridge

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: careguide-cadvisor
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=true
      # The Docker storage driver on this host is "overlayfs" (the containerd
      # image store). cAdvisor >= v0.55 therefore also needs a containerd
      # client to enumerate containers, and it refuses to register the Docker
      # factory when that client cannot be created. Both endpoints are stated
      # explicitly so the values do not depend on the image defaults.
      - --docker=unix:///var/run/docker.sock
      - --containerd=/containerd/containerd.sock
      - --containerd-namespace=moby
    volumes:
      - /:/rootfs:ro
      # /var/run carries the cgroup and Docker runtime state.
      - /var/run:/var/run:ro
      # Mounted as a single file on purpose: on Docker Desktop /var/run/docker.sock
      # is a symlink into ~/.docker/run, and mounting the directory above would
      # leave a dangling symlink inside the container. Mounting the socket file
      # directly makes Docker resolve the symlink on the host.
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock:ro
      # The containerd socket of the Docker Desktop VM. Required whenever the
      # Docker storage driver is "overlayfs"; without it cAdvisor registers
      # only the raw factory and reports no per-container metrics.
      # It is mounted outside /var/run on purpose: /var/run is a read-only
      # mount above, and /run is a symlink to it, so a mountpoint created
      # there would fail with "read-only file system".
      - ${CONTAINERD_SOCK:-/run/containerd/containerd.sock}:/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg:/dev/kmsg
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - app-bridge

  grafana:
    image: grafana/grafana:11.2.0
    container_name: careguide-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "admin"
      # The password comes from the Docker Compose secret, never from the
      # environment or the image.
      GF_SECURITY_ADMIN_PASSWORD__FILE: "/run/secrets/grafana_admin_password"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
    secrets:
      - grafana_admin_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    extra_hosts:
      # Lets the contact point reach a webhook on the host.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.5
    networks:
      - app-bridge

secrets:
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

volumes:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:

networks:
  app-bridge:
    name: app-bridge
    external: true
