# Loki configuration — single binary, filesystem storage.
#
# Retention: 7 days (168h). Retention is enforced by the compactor, which
# requires the retention_enabled flag below; the delete request store must be
# configured for the compactor to accept deletion requests.

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 50
  delete_request_store: filesystem

limits_config:
  # 7 days retention.
  retention_period: 168h
  # Allow the structured metadata written by Grafana Alloy.
  allow_structured_metadata: true
  max_query_series: 5000
  reject_old_samples: false

ruler:
  alertmanager_url: http://localhost:9093

analytics:
  reporting_enabled: false
