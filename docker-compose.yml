# CareGuide — application stack.
#
# The service image is built from ./app (see app/Dockerfile). The image serves
# FastAPI on port 8080 with the application code mounted at /app and exposes
# /health (liveness) and /metrics (Prometheus).
#
# The bridge network is created here and shared with the monitoring stack in
# docker-compose.monitoring.yml, which attaches to it as an external network.

name: careguide-app

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: careguide/system-health:1.0.0
    container_name: careguide-app
    ports:
      - "8080:8080"
    environment:
      APP_NAME: "system-health"
      APP_VERSION: "1.0.0"
      HOST: "0.0.0.0"
      PORT: "8080"
      LOG_LEVEL: "INFO"
      LOG_FORMAT: "json"
      METRICS_PATH: "/metrics"
      GRACEFUL_TIMEOUT: "30"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -c
        - "import sys,urllib.request;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3).status==200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 256m
    cpus: 0.5
    networks:
      - app-bridge

networks:
  app-bridge:
    name: app-bridge
    driver: bridge
